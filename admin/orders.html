<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kelola Pesanan - Admin RiRa Cakes</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-wrapper">
        <aside class="sidebar">
            <div class="sidebar-logo">RiRa <span>Cakes</span></div>
            <ul class="sidebar-menu">
                <li><a href="index.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                <li><a href="products.html"><i class="fas fa-box"></i> Produk</a></li>
                <li><a href="orders.html" class="active"><i class="fas fa-shopping-bag"></i> Pesanan</a></li>
                <li><a href="chat.html" data-chat-unread><i class="fas fa-comments"></i> Chat Customer</a></li>
                <li><a href="vouchers.html"><i class="fas fa-ticket-alt"></i> Voucher</a></li>
                <li><a href="custom-cakes.html"><i class="fas fa-birthday-cake"></i> Custom Cake</a></li>
                <li><a href="reviews.html"><i class="fas fa-star"></i> Ulasan</a></li>
                <li><a href="../index.html" target="_blank"><i class="fas fa-globe"></i> Lihat Website</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h1>Kelola Pesanan</h1>
                <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                    <select id="statusFilter" onchange="loadOrders()" style="padding: 8px 15px; border-radius: 8px; border: 1px solid #ddd;">
                        <option value="all">Semua Status</option>
                        <option value="pending">Pending</option>
                        <option value="paid">Paid</option>
                        <option value="processing">Processing</option>
                        <option value="shipped">Shipped</option>
                        <option value="completed">Completed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                    <label for="reportFrom">Dari</label>
                    <input type="date" id="reportFrom" aria-label="Tanggal awal laporan" style="padding:8px;border:1px solid #ddd;border-radius:8px;">
                    <label for="reportTo">Sampai</label>
                    <input type="date" id="reportTo" aria-label="Tanggal akhir laporan" style="padding:8px;border:1px solid #ddd;border-radius:8px;">
                    <button class="btn btn-success btn-sm" type="button" onclick="exportReport('excel')"><i class="fas fa-file-excel"></i> Excel</button>
                    <button class="btn btn-danger btn-sm" type="button" onclick="exportReport('pdf')"><i class="fas fa-file-pdf"></i> PDF</button>
                </div>
            </div>

            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Kode</th>
                            <th>Customer</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Pembayaran</th>
                            <th>Status</th>
                            <th>Tanggal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTable"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- DETAIL MODAL -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-box">
            <h2>Detail Pesanan</h2>
            <div id="orderDetail"></div>
            <div style="margin-top: 20px;">
                <label>Update Status:</label>
                <select id="newStatus" style="padding: 10px; border-radius: 8px; border: 1px solid #ddd; width: 100%; margin-top: 5px;">
                    <option value="pending">Pending</option>
                    <option value="paid">Paid</option>
                    <option value="processing">Processing</option>
                    <option value="shipped">Shipped</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                <button class="btn" onclick="document.getElementById('detailModal').classList.remove('active')" style="background:#eee;">Tutup</button>
                <button class="btn btn-primary" onclick="updateStatus()">Update Status</button>
            </div>
        </div>
    </div>

    <script>
        const API = '../api';
        const formatRupiah = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n);
        let currentOrderId = null;

        function exportReport(format) {
            const from = document.getElementById('reportFrom').value;
            const to = document.getElementById('reportTo').value;
            if (from && to && from > to) {
                alert('Tanggal awal tidak boleh melewati tanggal akhir.');
                return;
            }

            const params = new URLSearchParams({
                format,
                status: document.getElementById('statusFilter').value
            });
            if (from) params.set('from', from);
            if (to) params.set('to', to);

            const url = `${API}/admin/report.php?${params.toString()}`;
            if (format === 'pdf') {
                window.open(url, '_blank', 'noopener');
            } else {
                window.location.href = url;
            }
        }

        async function loadOrders() {
            const status = document.getElementById('statusFilter').value;
            const res = await fetch(`${API}/admin/order.php?status=${status}`, { credentials: 'include' });
            const result = await res.json();
            if (!result.success) return alert(result.message);

            document.getElementById('ordersTable').innerHTML = result.data.map(o => `
                <tr>
                    <td><strong>#${o.order_code}</strong></td>
                    <td>${o.recipient_name}<br><small style="color:#888;">${o.recipient_phone}</small></td>
                    <td>${o.items.length} item</td>
                    <td>${formatRupiah(o.total_amount)}</td>
                    <td><span class="badge badge-info">${o.payment_method.toUpperCase()}</span></td>
                    <td><span class="badge badge-${o.status}">${o.status}</span></td>
                    <td>${new Date(o.created_at).toLocaleString('id-ID')}</td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick='viewOrder(${JSON.stringify(o)})'><i class="fas fa-eye"></i></button>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="8" style="text-align:center;color:#999;">Tidak ada pesanan</td></tr>';
        }

        function viewOrder(o) {
            currentOrderId = o.id;
            document.getElementById('newStatus').value = o.status;
            
            let itemsHtml = o.items.map(i => `
                <div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee;">
                    <img src="../${i.image_url || 'https://via.placeholder.com/50'}" style="width:50px;height:50px;border-radius:6px;object-fit:cover;">
                    <div style="flex:1;">
                        <div style="font-weight:600;">${i.product_name}</div>
                        <div style="font-size:0.85rem;color:#888;">${i.quantity} x ${formatRupiah(i.price)}</div>
                    </div>
                    <div style="font-weight:600;">${formatRupiah(i.quantity * i.price)}</div>
                </div>
            `).join('');

            let paymentHtml = '';
            try {
                const pd = JSON.parse(o.payment_details);
                if (o.payment_method === 'transfer') {
                    paymentHtml = `<p><strong>Bank:</strong> ${pd.bank}<br><strong>No. Rek:</strong> ${pd.account_number}<br><strong>A/N:</strong> ${pd.account_holder}</p>`;
                } else if (o.payment_method === 'qris') {
                    paymentHtml = `<p>QRIS - Scan untuk bayar</p>`;
                } else {
                    paymentHtml = `<p>COD - Bayar di tempat</p>`;
                }
            } catch(e) { paymentHtml = '<p>-</p>'; }

            const proofHtml = o.payment_proof
                ? `<p><strong>Bukti transfer:</strong> <a href="../api/admin/payment_proof.php?order_id=${encodeURIComponent(o.id)}" target="_blank" rel="noopener">Lihat bukti</a></p>`
                : '<p><strong>Bukti transfer:</strong> Belum diunggah</p>';

            document.getElementById('orderDetail').innerHTML = `
                <div style="background:#f9f9f9;padding:15px;border-radius:8px;margin-bottom:15px;">
                    <p><strong>Kode:</strong> #${o.order_code}</p>
                    <p><strong>Customer:</strong> ${o.recipient_name} (${o.recipient_phone})</p>
                    <p><strong>Alamat:</strong> ${o.address}</p>
                    <p><strong>Pengiriman:</strong> ${o.shipping_method}</p>
                    <p><strong>Pembayaran:</strong> ${o.payment_method.toUpperCase()}</p>
                </div>
                <h3 style="margin-bottom:10px;">Items</h3>
                ${itemsHtml}
                <div style="margin-top:15px;padding:15px;background:#f9f9f9;border-radius:8px;">
                    <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
                        <span>Subtotal:</span><span>${formatRupiah(o.subtotal)}</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
                        <span>Diskon${o.voucher_code ? ` (${o.voucher_code})` : ''}:</span><span>-${formatRupiah(o.discount || 0)}</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
                        <span>Ongkir:</span><span>${formatRupiah(o.shipping_cost)}</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;border-top:1px dashed #ccc;padding-top:8px;margin-top:8px;">
                        <span>TOTAL:</span><span>${formatRupiah(o.total_amount)}</span>
                    </div>
                </div>
                <h3 style="margin:15px 0 10px;">Info Pembayaran</h3>
                ${paymentHtml}
                ${proofHtml}
            `;
            document.getElementById('detailModal').classList.add('active');
        }

        async function updateStatus() {
            const status = document.getElementById('newStatus').value;
            const res = await fetch(`${API}/admin/order.php`, {
                method: 'PUT',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: currentOrderId, status })
            });
            const result = await res.json();
            if (result.success) {
                const emailMessage = result.email_sent
                    ? 'Notifikasi email berhasil dikirim.'
                    : result.email_recipient_available
                        ? 'Notifikasi email belum terkirim. Periksa konfigurasi SMTP.'
                        : 'Customer belum mengisi alamat email.';
                alert(`Status diupdate! ${emailMessage}`);
                document.getElementById('detailModal').classList.remove('active');
                loadOrders();
            } else {
                alert('Gagal: ' + result.message);
            }
        }

        loadOrders();
    </script>
    <script src="../js/chat-unread.js" data-api="../api/chat.php"></script>
</body>
</html>
