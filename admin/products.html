<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kelola Produk - Admin RiRa Cakes</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-wrapper">
        <aside class="sidebar">
            <div class="sidebar-logo">RiRa <span>Cakes</span></div>
            <ul class="sidebar-menu">
                <li><a href="index.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                <li><a href="products.html" class="active"><i class="fas fa-box"></i> Produk</a></li>
                <li><a href="orders.html"><i class="fas fa-shopping-bag"></i> Pesanan</a></li>
                <li><a href="chat.html" data-chat-unread><i class="fas fa-comments"></i> Chat Customer</a></li>
                <li><a href="vouchers.html"><i class="fas fa-ticket-alt"></i> Voucher</a></li>
                <li><a href="custom-cakes.html"><i class="fas fa-birthday-cake"></i> Custom Cake</a></li>
                <li><a href="reviews.html"><i class="fas fa-star"></i> Ulasan</a></li>
                <li><a href="../index.html" target="_blank"><i class="fas fa-globe"></i> Lihat Website</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h1>Kelola Produk</h1>
                <button class="btn btn-primary" onclick="openProductModal()"><i class="fas fa-plus"></i> Tambah Produk</button>
            </div>

            <div class="card">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
                    <label for="categoryFilter" style="font-weight:500;">Filter kategori</label>
                    <select id="categoryFilter" style="min-width:220px;padding:10px;border:1px solid #ddd;border-radius:8px;">
                        <option value="all">Semua kategori</option>
                        <option value="basah">Kue Basah</option>
                        <option value="kering">Kue Kering</option>
                        <option value="roti">Roti &amp; Pastry</option>
                    </select>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Gambar</th>
                            <th>Nama Produk</th>
                            <th>Kategori</th>
                            <th>Harga</th>
                            <th>Stok</th>
                            <th>Terjual</th>
                            <th>Label</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="productsTable"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL FORM -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-box">
            <h2 id="modalTitle">Tambah Produk</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label>Nama Produk</label>
                    <input type="text" id="pName" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Kategori</label>
                        <select id="pCategory" required>
                            <option value="1">Kue Basah</option>
                            <option value="2">Kue Kering</option>
                            <option value="3">Roti & Pastry</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Label</label>
                        <select id="pLabel">
                            <option value="">Tidak ada</option>
                            <option value="Best Seller">Best Seller</option>
                            <option value="New">New</option>
                            <option value="Promo">Promo</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Harga (Rp)</label>
                        <input type="number" id="pPrice" required min="0">
                    </div>
                    <div class="form-group">
                        <label>Stok</label>
                        <input type="number" id="pStock" required min="0">
                    </div>
                </div>
                <div class="form-group">
                    <label>Deskripsi</label>
                    <textarea id="pDesc" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Gambar Produk</label>
                    <div class="image-upload" id="imageUpload" onclick="document.getElementById('pImage').click()">
                        <i class="fas fa-cloud-upload-alt" style="font-size: 2rem; color: #ccc;"></i>
                        <p style="margin-top: 10px; color: #888;">Klik untuk upload (max 2MB)</p>
                        <img id="imagePreview" style="display:none;">
                    </div>
                    <input type="file" id="pImage" accept="image/*" style="display:none;" onchange="previewImage(this)">
                    <input type="hidden" id="pImageUrl">
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                    <button type="button" class="btn" onclick="closeModal()" style="background:#eee;">Batal</button>
                    <button type="submit" class="btn btn-primary">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API = '../api';
        const formatRupiah = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n);
        let products = [];
        const productImageUrl = (url) => {
            if (!url) return 'https://via.placeholder.com/50';
            if (/^(https?:)?\/\//i.test(url) || url.startsWith('/') || url.startsWith('data:')) return url;
            return `../${url.replace(/^(\.\/)+/, '')}`;
        };

        function renderProducts() {
            const category = document.getElementById('categoryFilter').value;
            const filteredProducts = category === 'all'
                ? products
                : products.filter(product => product.category_slug === category);

            document.getElementById('productsTable').innerHTML = filteredProducts.length
                ? filteredProducts.map((p, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td><img src="${productImageUrl(p.image_url)}" class="product-thumb" onerror="this.onerror=null;this.src='https://via.placeholder.com/50'"></td>
                    <td><strong>${p.name}</strong></td>
                    <td>${p.category_name || '-'}</td>
                    <td>${formatRupiah(p.price)}</td>
                    <td>${p.stock < 10 ? `<span style="color:red;">${p.stock}</span>` : p.stock}</td>
                    <td>${p.sold_count}</td>
                    <td>${p.label ? `<span class="badge badge-paid">${p.label}</span>` : '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick="editProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('')
                : '<tr><td colspan="9" style="text-align:center;padding:20px;">Tidak ada produk dalam kategori ini.</td></tr>';
        }

        async function loadProducts() {
            const res = await fetch(`${API}/admin/products.php`, { credentials: 'include' });
            const result = await res.json();
            if (!result.success) return alert(result.message);

            products = result.data;
            renderProducts();
        }

        function openProductModal() {
            document.getElementById('modalTitle').textContent = 'Tambah Produk';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('pImageUrl').value = '';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('productModal').classList.add('active');
        }

        function editProduct(p) {
            document.getElementById('modalTitle').textContent = 'Edit Produk';
            document.getElementById('productId').value = p.id;
            document.getElementById('pName').value = p.name;
            document.getElementById('pCategory').value = p.category_id;
            document.getElementById('pLabel').value = p.label || '';
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pStock').value = p.stock;
            document.getElementById('pDesc').value = p.description || '';
            document.getElementById('pImageUrl').value = p.image_url || '';
            if (p.image_url) {
                const preview = document.getElementById('imagePreview');
                preview.src = productImageUrl(p.image_url);
                preview.style.display = 'block';
            }
            document.getElementById('productModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
        }

        async function previewImage(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                if (file.size > 2 * 1024 * 1024) {
                    alert('Ukuran file maksimal 2MB');
                    return;
                }

                // Upload dulu
                const formData = new FormData();
                formData.append('image', file);
                const res = await fetch(`${API}/upload.php`, { method: 'POST', credentials: 'include', body: formData });
                const result = await res.json();
                if (result.success) {
                    document.getElementById('pImageUrl').value = result.url;
                    const preview = document.getElementById('imagePreview');
                    preview.src = productImageUrl(result.url);
                    preview.style.display = 'block';
                } else {
                    alert('Upload gagal: ' + result.message);
                }
            }
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const data = {
                name: document.getElementById('pName').value,
                category_id: document.getElementById('pCategory').value,
                label: document.getElementById('pLabel').value,
                price: document.getElementById('pPrice').value,
                stock: document.getElementById('pStock').value,
                description: document.getElementById('pDesc').value,
                image_url: document.getElementById('pImageUrl').value
            };

            let method = 'POST';
            if (id) { data.id = id; method = 'PUT'; }

            const res = await fetch(`${API}/admin/products.php`, {
                method: method,
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (result.success) {
                alert('Berhasil!');
                closeModal();
                loadProducts();
            } else {
                alert('Gagal: ' + result.message);
            }
        });

        async function deleteProduct(id) {
            if (!confirm('Yakin hapus produk ini?')) return;
            const res = await fetch(`${API}/admin/products.php?id=${id}`, {
                method: 'DELETE', credentials: 'include'
            });
            const result = await res.json();
            if (result.success) loadProducts();
            else alert(result.message);
        }

        document.getElementById('categoryFilter').addEventListener('change', renderProducts);
        loadProducts();
    </script>
    <script src="../js/chat-unread.js" data-api="../api/chat.php"></script>
</body>
</html>
