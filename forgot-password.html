<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - RiRa Cakes</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .reset-wrapper { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:linear-gradient(135deg,var(--secondary),#fff); }
        .reset-card { width:100%; max-width:500px; padding:40px; background:#fff; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.1); }
        .reset-card h1 { margin-bottom:10px; font-size:1.8rem; }
        .reset-card > p { margin-bottom:24px; color:var(--text-light); }
        .reset-message { min-height:24px; margin:12px 0; }
        .reset-message.error { color:#b00020; }
        .reset-message.success { color:#26733b; }
        .reset-actions { display:flex; align-items:center; gap:12px; margin-top:18px; }
        .reset-actions .btn { flex:1; text-align:center; }
        @media(max-width:500px) { .reset-card { padding:28px 22px; } .reset-actions { flex-direction:column; align-items:stretch; } }
    </style>
</head>
<body>
    <main class="reset-wrapper">
        <section class="reset-card">
            <h1>Reset Password</h1>
            <p>Kami akan mengirim kode verifikasi ke email atau WhatsApp yang terdaftar pada akun Anda. Kode berlaku selama 10 menit.</p>

            <form id="requestResetForm">
                <div class="form-group">
                    <label for="resetEmail">Email akun</label>
                    <input id="resetEmail" name="email" type="email" autocomplete="email" required maxlength="100" placeholder="email@contoh.com">
                </div>
                <div class="form-group">
                    <label for="resetChannel">Metode verifikasi</label>
                    <select id="resetChannel" name="channel" required>
                        <option value="email">Email</option>
                        <option value="whatsapp">WhatsApp</option>
                    </select>
                </div>
                <p id="channelSetupMessage" class="reset-message" role="status"></p>
                <button id="requestResetButton" type="submit" class="btn btn-primary" style="width:100%;">Kirim Kode Verifikasi</button>
            </form>

            <form id="completeResetForm" style="display:none;">
                <div class="form-group">
                    <label for="resetCode">Kode verifikasi 6 digit</label>
                    <input id="resetCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">Password baru</label>
                    <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="200" required>
                </div>
                <button id="completeResetButton" type="submit" class="btn btn-primary" style="width:100%;">Simpan Password Baru</button>
            </form>
            <p id="resetMessage" class="reset-message" role="status" aria-live="polite"></p>
            <div class="reset-actions">
                <a href="login.html" class="btn" style="background:#eee;">Kembali ke Login</a>
                <a href="index.html" class="btn" style="background:#eee;">Kembali ke Toko</a>
            </div>
        </section>
    </main>
    <script src="js/password-reset.js"></script>
</body>
</html>
